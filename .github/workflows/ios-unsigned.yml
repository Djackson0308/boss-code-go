name: iOS unsigned archive verification
on:
  push:
    branches: [ios/testflight-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Compile unsigned iPhoneOS archive
        run: bash mobile/scripts/ios-build.sh
      - name: Read-only iPhone simulator startup
        run: bash mobile/scripts/ios-simulator-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-unsigned-build-evidence
          path: |
            mobile/artifacts/ios/*.txt
            mobile/artifacts/ios/*.log
            mobile/artifacts/ios/*.json
            mobile/artifacts/ios/*.png
          retention-days: 1
