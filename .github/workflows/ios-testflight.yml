name: GO internal TestFlight deployment
on:
  push:
    branches: [ios/testflight-deploy]
    paths: [mobile/ci/testflight-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-internal-testflight
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/ios/testflight-deploy' && github.repository == 'Djackson0308/boss-code-go'
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight-internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check 'codemagic-cli-tools==0.70.1'
          npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Build, sign, upload, and verify Apple processing
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY }}
          APP_STORE_CONNECT_DISABLE_JWT_CACHE: 'true'
        run: bash mobile/scripts/ios-testflight.sh
      - name: Preserve sanitized Apple processing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-testflight-processing-${{ github.run_id }}
          path: mobile/artifacts/ios-testflight/processing.json
          if-no-files-found: ignore
          retention-days: 7
